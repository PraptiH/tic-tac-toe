<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Tic Tac Toe</title>
    <style>
        body {
            background-color: lavenderblush;
        }
        .btn{
            width: 15vmin;
            height: 15vmin;
            border: 1px solid rgb(25, 198, 255);
            border-radius: 10px;
            background-color: aquamarine;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <h1 class="text-6xl font-bold italic text-center mt-[10%]">Tic Tac Toe</h1>
    <section class="text-center space-y-5 mt-[5%] py-[2%] h-[60vmin] w-[70vmin] mx-auto ">
        <div class="space-x-5">
            <button class="btn"></button>
            <button class="btn"></button>
            <button class="btn"></button>
        </div>
        <div class="space-x-5">
            <button class="btn"></button>
            <button class="btn"></button>
            <button class="btn"></button>
        </div>
        <div class="space-x-5">
            <button class="btn"></button>
            <button class="btn"></button>
            <button class="btn"></button>
        </div>

        <div>
            <button class="border-1 border-teal-300 bg-teal-500 p-3 rounded-xl text-lg text-fuchsia-200">Reset Game</button>
        </div>
    </section>
    <script src="./script.js"></script>
</body>

</html>
